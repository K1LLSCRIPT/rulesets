[General]
# Ninja + 2 Providers
DOWNLOAD_FILE = url=https://

  , path=/etc/openclash/config/ninja.yaml, force=true
CONFIG_FILE = /etc/openclash/config/ninja.yaml
SUB_INFO_URL = $EN_KEY1
RESTART = true

[Overwrite]
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "Provider_01" "['url']" "$EN_KEY1"
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "Provider_02" "['url']" "$EN_KEY2"

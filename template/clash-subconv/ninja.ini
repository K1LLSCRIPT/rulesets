;Custom_OpenClash_Rules (на основе ninja.yml от K1LLSCRIPT)
;Распакованный и адаптированный под формат OpenClash
;Автор оригинала: K1LLSCRIPT
;Адаптация: Grok

[custom]
;==================== Правила (порядок важен) ====================

; Локальные и приватные
ruleset=🎯 Direct,[]GEOSITE,private
ruleset=🎯 Direct,[]GEOIP,private,no-resolve
ruleset=🎯 Direct,clash-classic:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.yaml,86400
ruleset=🎯 Direct,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.yaml,86400

; Кастомные домены прямого подключения
ruleset=🎯 Direct,clash-classic:https://raw.githubusercontent.com/K1LLSCRIPT/rulesets/refs/heads/main/clash/classical/blocked_in_rf.yaml,86400

; Telegram / WhatsApp / Discord → AntiMAX
ruleset=🚀 AntiMAX,clash-domain:https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/telegram.mrs,86400
ruleset=🚀 AntiMAX,clash-classic:https://raw.githubusercontent.com/OMchik33/custom-rules/refs/heads/main/mihomo/telegram-ips.yaml,86400
ruleset=🚀 AntiMAX,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/whatsapp.mrs,86400
ruleset=🚀 AntiMAX,clash-classic:https://raw.githubusercontent.com/OMchik33/custom-rules/refs/heads/main/mihomo/whatsapp-ips.yaml,86400
ruleset=🚀 AntiMAX,clash-classic:https://raw.githubusercontent.com/fildunsky/clash_discord/refs/heads/main/discord-ip.yaml,86400
ruleset=🚀 AntiMAX,clash-classic:https://raw.githubusercontent.com/fildunsky/clash_discord/refs/heads/main/discord-domain.yaml,86400

; Социальные сети
ruleset=💬 Social Networks,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.yaml,86400
ruleset=💬 Social Networks,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/instagram.yaml,86400
ruleset=💬 Social Networks,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Notion/Notion.yaml,86400
ruleset=💬 Social Networks,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/meta.yaml,86400

; Россия
ruleset=🇷🇺 Russia,[]GEOIP,ru,no-resolve
ruleset=🇷🇺 Russia,clash-classic:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/ru.yaml,86400
ruleset=🇷🇺 Russia,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-gov-ru.yaml,86400
ruleset=🇷🇺 Russia,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ru.yaml,86400

; Microsoft
ruleset=Ⓜ️ Microsoft,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.yaml,86400

; Battle.net
ruleset=🎮 Battle.net,clash-classic:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/blizzard.yaml,86400
ruleset=🎮 Battle.net,clash-classic:https://raw.githubusercontent.com/K1LLSCRIPT/rulesets/refs/heads/main/clash/classical/blizzard.yaml,86400

; Speedtest
ruleset=🚀 Speedtest,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/ookla-speedtest.yaml,86400
ruleset=🚀 Speedtest,clash-domain:https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/speedtest.yaml,86400

; YouTube
ruleset=📹 YouTube,[]GEOSITE,youtube

; Google
ruleset=🇬 Google,[]GEOSITE,google
ruleset=🇬 Google,[]GEOIP,google,no-resolve

; Netflix + Disney + HBO
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=🎥 Netflix,[]GEOIP,netflix,no-resolve
ruleset=🎥 Netflix,[]GEOSITE,disney
ruleset=🎥 Netflix,[]GEOSITE,hbo

; Games
ruleset=🎮 Games,[]GEOSITE,category-games
ruleset=🎮 Games,[]GEOSITE,dmm

; Stocks
ruleset=📈 Stocks,clash-domain:https://raw.githubusercontent.com/K1LLSCRIPT/rulesets/main/clash/stocks.yaml,86400

; OpenAI + AI
ruleset=🤖 OpenAI,clash-domain:https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/openai.mrs,86400
ruleset=🤖 OpenAI,clash-domain:https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/google-gemini.mrs,86400
ruleset=🤖 OpenAI,clash-domain:https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/anthropic.mrs,86400
ruleset=🤖 OpenAI,clash-domain:https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/perplexity.mrs,86400
ruleset=🤖 OpenAI,clash-classic:https://raw.githubusercontent.com/K1LLSCRIPT/rulesets/refs/heads/main/clash/classical/misc-ai.yaml,86400

; FFFUUUUU (Akamai + analytics)
ruleset=🚀 FFFUUUUU,[]GEOSITE,akamai

; AdBlock
ruleset=🚫 AdBlock,[]GEOSITE,category-ads-all

; Финальный
ruleset=🐟 Fallback,[]FINAL

;==================== Группы ====================

; Основные
custom_proxy_group=🚀 AntiMAX`url-test`.*`http://www.gstatic.com/generate_204`100,,50
custom_proxy_group=⁖ Automatic`url-test`(🇺🇸|🇳🇱|🇨🇭|🇩🇪|🇱🇻|🇪🇪|🇫🇮|🇦🇪|🇳🇵)`http://www.gstatic.com/generate_204`100,,50
custom_proxy_group=🇷🇺 Russia`select`(🇷🇺)`[]🎯 Direct`.*
custom_proxy_group=🇪🇺 Europe`load-balance`(🇳🇱|🇨🇭|🇩🇪|🇱🇻|🇪🇪|🇫🇮)`http://www.gstatic.com/generate_204`100,,50
custom_proxy_group=🇺🇸 USA`load-balance`(🇺🇸|🇳🇵)`http://www.gstatic.com/generate_204`100,,50

; Сервисные группы
custom_proxy_group=💬 Social Networks`select`[]⁖ Automatic`[]🎯 Direct`[]🇪🇺 Europe`[]🇺🇸 USA`[]🇷🇺 Russia`.*
custom_proxy_group=📹 YouTube`select`[]⁖ Automatic`[]🎯 Direct`[]🇪🇺 Europe`[]🇺🇸 USA`[]🇷🇺 Russia`.*
custom_proxy_group=🇬 Google`select`[]⁖ Automatic`[]🎯 Direct`[]🇪🇺 Europe`[]🇺🇸 USA`[]🇷🇺 Russia`.*
custom_proxy_group=🎥 Netflix`select`[]⁖ Automatic`[]🎯 Direct`[]🇪🇺 Europe`[]🇺🇸 USA`.*
custom_proxy_group=🤖 OpenAI`select`[]⁖ Automatic`[]🎯 Direct`[]🇪🇺 Europe`[]🇺🇸 USA`.*
custom_proxy_group=🎮 Games`select`[]🎯 Direct`[]⁖ Automatic`[]🇪🇺 Europe`[]🇺🇸 USA`[]🇷🇺 Russia`.*
custom_proxy_group=🎮 Battle.net`select`[]🎯 Direct`[]⁖ Automatic`[]🇪🇺 Europe`[]🇺🇸 USA`[]🇷🇺 Russia`.*
custom_proxy_group=Ⓜ️ Microsoft`select`[]🎯 Direct`[]⁖ Automatic`[]🇪🇺 Europe`[]🇺🇸 USA`[]🇷🇺 Russia`.*
custom_proxy_group=🚀 Speedtest`select`[]⁖ Automatic`[]🎯 Direct`[]🇪🇺 Europe`[]🇺🇸 USA`.*
custom_proxy_group=📈 Stocks`select`[]🎯 Direct`[]⁖ Automatic`[]🇪🇺 Europe`[]🇺🇸 USA`[]🇷🇺 Russia`.*
custom_proxy_group=🚀 FFFUUUUU`select`[]⁖ Automatic`[]🎯 Direct`[]🇪🇺 Europe`[]🇺🇸 USA`[]🇷🇺 Russia`.*
custom_proxy_group=🚫 AdBlock`select`[]Block`[]⁖ Automatic`[]🎯 Direct

; Голосовые порты
custom_proxy_group=🔊 Voice Ports`select`[]🎯 Direct`[]⁖ Automatic`[]🇪🇺 Europe`[]🇺🇸 USA`[]🇷🇺 Russia`.*

; Финальные
custom_proxy_group=🐟 Fallback`select`[]⁖ Automatic`[]🎯 Direct
custom_proxy_group=🎯 Direct`select`[]DIRECT
custom_proxy_group=Block`select`hidden`[]REJECT

;==================== Параметры ====================
enable_rule_generator=true
overwrite_original_rules=true
